# app/data/scenarios/passwords.yaml
# 3 escenarios de contraseñas para simulación clásica

- id: "pw_001"
  module: "passwords"
  title: "Creando una cuenta nueva"
  context: |
    Estás registrándote en el portal de tu empresa. 
    El sistema te pide crear una contraseña. 
    ¿Cuál de estas opciones elegirías?
  password_options:
    - id: "a"
      value: "juan1990"
      label: "juan1990"
    - id: "b"
      value: "123456"
      label: "123456"
    - id: "c"
      value: "Tr0pico#Azul!2024"
      label: "Tr0pico#Azul!2024"
    - id: "d"
      value: "empresa2024"
      label: "empresa2024"
  correct_action: "choose_strong"
  correct_option: "c"
  risk: "alto"
  question: "¿Cuál contraseña es la más segura?"
  clues:
    - "'juan1990' usa información personal predecible (nombre + año)"
    - "'123456' es la contraseña más hackeada del mundo"
    - "'empresa2024' es predecible y corta"
    - "'Tr0pico#Azul!2024' tiene mayúsculas, minúsculas, números y símbolos (+12 chars)"
  actions:
    - id: "choose_strong"
      label: "Tr0pico#Azul!2024 ✓"
      style: "safe"
    - id: "choose_common"
      label: "123456 o juan1990"
      style: "danger"
    - id: "use_name"
      label: "Mi nombre + año"
      style: "warning"
    - id: "reuse_old"
      label: "Reutilizar una vieja"
      style: "danger"

- id: "pw_002"
  module: "passwords"
  title: "Te piden cambiar tu contraseña"
  context: |
    Tu empresa exige cambiar la contraseña cada 90 días. 
    Ya usaste 'MiClave2024!' el trimestre pasado. 
    ¿Qué harías?
  password_options:
    - id: "a"
      value: "MiClave2025!"
      label: "MiClave2025!  (solo cambio el año)"
    - id: "b"
      value: "K#9mPx!vQ2@nL"
      label: "K#9mPx!vQ2@nL  (nueva aleatoria)"
    - id: "c"
      value: "MiClave2024!"
      label: "MiClave2024!  (la misma de siempre)"
    - id: "d"
      value: "NombreMascota123"
      label: "NombreMascota123"
  correct_action: "use_manager"
  correct_option: "b"
  risk: "medio"
  question: "¿Cuál es la mejor práctica al cambiar contraseña?"
  clues:
    - "Cambiar solo el año ('2024' → '2025') es predecible y fácil de adivinar"
    - "Reutilizar la misma contraseña la expone si ya fue filtrada"
    - "Información personal como mascotas aparece en ataques de diccionario"
    - "Una contraseña aleatoria generada por un gestor es la opción más segura"
  actions:
    - id: "use_manager"
      label: "Usar gestor y generar nueva aleatoria"
      style: "safe"
    - id: "increment_year"
      label: "Cambiar solo el año al final"
      style: "warning"
    - id: "reuse"
      label: "Usar la misma de siempre"
      style: "danger"
    - id: "use_personal"
      label: "Usar datos personales"
      style: "danger"

- id: "pw_003"
  module: "passwords"
  title: "Un compañero te pide tu contraseña"
  context: |
    Tu compañero de trabajo dice que necesita acceder urgentemente 
    al sistema mientras tú no estás, y te pide que le des tu contraseña 
    temporalmente por WhatsApp. ¿Qué haces?
  password_options: null
  correct_action: "refuse_and_report"
  correct_option: null
  risk: "alto"
  question: "¿Cuál es la respuesta correcta?"
  clues:
    - "Las contraseñas son personales e intransferibles, sin excepción"
    - "Compartir por WhatsApp las expone a terceros y al historial del chat"
    - "Puede ser un ataque de ingeniería social, incluso si conoces a la persona"
    - "La solución correcta es gestionar accesos temporales con el administrador de TI"
  actions:
    - id: "refuse_and_report"
      label: "Negarme y escalar a TI"
      style: "safe"
    - id: "share_whatsapp"
      label: "Enviarla por WhatsApp"
      style: "danger"
    - id: "share_verbal"
      label: "Decírsela en persona"
      style: "danger"
    - id: "create_temp"
      label: "Crear una temporal yo mismo"
      style: "warning"