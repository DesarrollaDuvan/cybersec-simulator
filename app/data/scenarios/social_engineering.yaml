# app/data/scenarios/social_engineering.yaml
# 3 escenarios de ingeniería social para simulación inmersiva

- id: "is_001"
  module: "social"
  title: "El técnico de IT"
  location: "Oficina — Bogotá"
  description: "Es lunes por la mañana. Recibes una llamada inesperada."
  risk: "alto"
  thumbnail: "📞"
  stages:
    - id: "call_intro"
      type: "phone_call"
      caller: "Soporte Técnico — Ext. 4821"
      avatar: "🧑‍💻"
      transcript:
        - role: "caller"
          text: "Buenos días, le habla Carlos Méndez del departamento de soporte técnico. Estamos haciendo una actualización de seguridad urgente en todos los equipos de la empresa."
        - role: "caller"
          text: "Necesito que me confirme sus credenciales de acceso al sistema para verificar que su cuenta quede correctamente migrada antes de las 12 del mediodía, de lo contrario perderá acceso a sus archivos."
      choices:
        - id: "give_creds"
          label: "Darle las credenciales — es urgente"
          risk: "alto"
          icon: "ti-shield-off"
        - id: "ask_verify"
          label: "Pedirle que se identifique primero"
          risk: "bajo"
          icon: "ti-id"
        - id: "hang_up"
          label: "Colgar y llamar a IT directamente"
          risk: "bajo"
          icon: "ti-phone-off"
        - id: "give_partial"
          label: "Dar solo el usuario, no la clave"
          risk: "medio"
          icon: "ti-alert-triangle"
      correct: "hang_up"
      consequence_bad: "El atacante ahora tiene acceso completo a tu cuenta corporativa. En los siguientes 20 minutos accede a tus correos, documentos y transfiere $4.2M desde la cuenta de la empresa."
      consequence_good: "Correcto. Llamas al número oficial de IT y confirmas: nadie del equipo hizo esa llamada. Era un ataque de vishing. El número era falso."
    - id: "followup_email"
      type: "email"
      sender: "it-soporte@empresa-col.net"
      subject: "URGENTE: Completa la verificación de seguridad"
      body: "Como acordamos por teléfono, necesitamos que hagas clic en el siguiente enlace para completar la migración de tu cuenta antes de las 12:00 m."
      link_text: "https://portal-empresa.com/seguridad/verificar"
      link_real: "http://empresa-col.net.phish.ru/steal"
      transcript: []
      choices:
        - id: "click_link"
          label: "Hacer clic en el enlace"
          risk: "alto"
          icon: "ti-link"
        - id: "hover_check"
          label: "Revisar la URL real antes de hacer clic"
          risk: "bajo"
          icon: "ti-eye"
        - id: "report_phish"
          label: "Reportar el correo como phishing"
          risk: "bajo"
          icon: "ti-flag"
      correct: "report_phish"
      consequence_bad: "El enlace instala un keylogger silencioso. Todo lo que escribas desde ahora es enviado al atacante en tiempo real."
      consequence_good: "Excelente. El dominio del remitente era 'empresa-col.net' — no el dominio oficial. El enlace apuntaba a un servidor en Rusia."

- id: "is_002"
  module: "social"
  title: "El USB abandonado"
  location: "Parqueadero — Edificio corporativo"
  description: "Llegas al trabajo y encuentras algo en el piso."
  risk: "alto"
  thumbnail: "💾"
  stages:
    - id: "find_usb"
      type: "scene"
      scene_text: "Mientras caminas hacia el ascensor del edificio, ves un USB en el piso. Tiene una etiqueta que dice: 'NÓMINAS Q3 — CONFIDENCIAL'. No hay nadie más en el parqueadero."
      transcript: []
      choices:
        - id: "plug_in"
          label: "Conectarlo a tu PC para ver qué tiene"
          risk: "alto"
          icon: "ti-plug"
        - id: "plug_personal"
          label: "Conectarlo a mi celular personal"
          risk: "alto"
          icon: "ti-device-mobile"
        - id: "take_to_it"
          label: "Entregarlo a seguridad sin conectarlo"
          risk: "bajo"
          icon: "ti-shield-check"
        - id: "leave_it"
          label: "Dejarlo en el piso — no es mi problema"
          risk: "medio"
          icon: "ti-arrow-left"
      correct: "take_to_it"
      consequence_bad: "El USB ejecuta automáticamente un script al conectarse. En 8 segundos instala un troyano de acceso remoto. El atacante ahora tiene control total de tu equipo."
      consequence_good: "Correcto. El equipo de seguridad analiza el USB: contenía un AutoRun malicioso diseñado para infectar el primer equipo donde se conectara. La trampa era deliberada."
    - id: "colleague_pressure"
      type: "conversation"
      speaker: "Tu compañero Andrés"
      avatar: "👨‍💼"
      transcript:
        - role: "speaker"
          text: "¡Oye! Vi que encontraste ese USB. Yo lo conecté en mi laptop hace un momento para ver qué tenía. Creo que son los datos de nómina del trimestre anterior."
        - role: "speaker"
          text: "¿Tú lo conectaste también? Deberías hacerlo, todos necesitan ver esto."
      choices:
        - id: "follow_colleague"
          label: "Si Andrés lo hizo, entonces está bien"
          risk: "alto"
          icon: "ti-users"
        - id: "warn_colleague"
          label: "Advertir a Andrés y escalar a seguridad"
          risk: "bajo"
          icon: "ti-alert"
        - id: "ignore"
          label: "Ignorar y conectarlo yo también"
          risk: "alto"
          icon: "ti-eye-off"
      correct: "warn_colleague"
      consequence_bad: "La presión social funcionó. Conectas el USB. El malware se propaga ahora a tu equipo. Dos máquinas infectadas en el mismo edificio."
      consequence_good: "Correcto. La presión de grupo es una táctica clásica. Andrés tampoco lo conectó — era parte de la prueba. Reportas el incidente a tiempo."

- id: "is_003"
  module: "social"
  title: "El mensaje de WhatsApp"
  location: "Tu teléfono — Cualquier lugar"
  description: "Recibes un mensaje de un número desconocido."
  risk: "medio"
  thumbnail: "💬"
  stages:
    - id: "whatsapp_msg"
      type: "chat_message"
      sender: "+57 320 *** 4821"
      avatar: "👤"
      transcript:
        - role: "sender"
          text: "Hola! Soy tu jefe, el Dr. Ramírez. Estoy en una reunión y no puedo llamar."
        - role: "sender"
          text: "Necesito que hagas una transferencia urgente de $2.800.000 a este número de cuenta antes de las 3pm. Te explico todo después. Es para cerrar un contrato importante."
        - role: "sender"
          text: "Cuenta: 456-789-123 Bancolombia. Es MUY urgente."
      choices:
        - id: "transfer"
          label: "Hacer la transferencia — el jefe lo pide"
          risk: "alto"
          icon: "ti-credit-card"
        - id: "call_boss"
          label: "Llamar al número REAL de mi jefe a verificar"
          risk: "bajo"
          icon: "ti-phone"
        - id: "ask_account"
          label: "Pedir más detalles por WhatsApp"
          risk: "medio"
          icon: "ti-message"
        - id: "ignore_msg"
          label: "Ignorar el mensaje"
          risk: "medio"
          icon: "ti-eye-off"
      correct: "call_boss"
      consequence_bad: "Haces la transferencia. Minutos después llamas a tu jefe real y descubres que él no envió ningún mensaje. El dinero ya fue retirado. Es irrecuperable."
      consequence_good: "Tu jefe contesta y confirma que él no mandó ningún mensaje. Era un número clonado. CEO Fraud — el atacante había obtenido el nombre de tu jefe de LinkedIn."
    - id: "fake_link"
      type: "chat_message"
      sender: "+57 320 *** 4821"
      avatar: "👤"
      transcript:
        - role: "sender"
          text: "Entiendo, disculpa la confusión 😅 Mira, al menos revisa este documento con los detalles del contrato del que te hablé:"
        - role: "sender"
          text: "https://docs-google.com-contrato2024.tk/ver"
      choices:
        - id: "open_link"
          label: "Abrir el enlace — parece de Google Docs"
          risk: "alto"
          icon: "ti-link"
        - id: "check_domain"
          label: "Revisar el dominio — algo no cuadra"
          risk: "bajo"
          icon: "ti-zoom-in"
        - id: "block"
          label: "Bloquear el número y reportar"
          risk: "bajo"
          icon: "ti-ban"
      correct: "block"
      consequence_bad: "El enlace abre una página que imita Google Docs y pide tus credenciales de Google. Las ingresas. Tu cuenta de Gmail es comprometida en segundos."
      consequence_good: "Correcto. 'docs-google.com-contrato2024.tk' — el dominio real es '.tk', no google.com. El 'google.com' era parte del subdominio para engañar a simple vista."