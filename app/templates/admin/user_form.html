{% extends "base_admin.html" %}
{% block content %}
<div class="admin-page" style="max-width: 560px;">

  <div class="admin-header">
    <div>
      <div class="admin-eyebrow"><a href="{{ url_for('admin.users') }}" class="admin-back">← Usuarios</a></div>
      <h1 class="admin-title">{{ 'Editar usuario' if action == 'edit' else 'Nuevo usuario' }}</h1>
    </div>
  </div>

  <div class="admin-card">
    <form method="POST" class="admin-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Correo electrónico *</label>
        <input type="email" name="email" class="form-input" required
               value="{{ user.email if user else '' }}" placeholder="usuario@email.com">
      </div>

      <div class="form-group">
        <label class="form-label">Nombre completo</label>
        <input type="text" name="name" class="form-input"
               value="{{ user.name if user else '' }}" placeholder="Nombre opcional">
      </div>

      <div class="form-group">
        <label class="form-label">
          {{ 'Nueva contraseña' if action == 'edit' else 'Contraseña *' }}
          {% if action == 'edit' %}<span class="form-hint">(dejar vacío para no cambiar)</span>{% endif %}
        </label>
        <input type="password" name="password" class="form-input" {{ 'required' if action == 'create' else '' }}
               placeholder="{{ 'Nueva contraseña' if action == 'edit' else 'Mínimo 6 caracteres' }}">
      </div>

      {% if action == 'edit' and user %}
      <div class="form-group">
        <label class="checkbox-label">
          <input type="checkbox" name="is_active" class="checkbox-input" {{ 'checked' if user.is_active else '' }}>
          <span class="checkbox-box"></span>
          Usuario activo
        </label>
      </div>
      {% endif %}

      <div class="form-actions">
        <a href="{{ url_for('admin.users') }}" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">
          {{ 'Guardar cambios' if action == 'edit' else 'Crear usuario' }}
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
