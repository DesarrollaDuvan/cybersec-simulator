{% extends "base.html" %}
{% block title %}{{ scenario.title }} — Simulación{% endblock %}

{% block content %}
<script>
const SCENARIO = {{ scenario | tojson }};
let currentStageIndex = 0;
let totalPoints = 0;
let awaitingNext = false;
</script>

<div style="max-width:720px;margin:0 auto;padding:1.5rem 0 4rem;" id="simContainer">

  <!-- Header fijo del escenario -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
    <div>
      <a href="{{ url_for('sim_immersive.home') }}" class="back-link">
        ← Simulaciones
      </a>
      <h1 id="scenarioTitle" style="font-size:1.4rem;font-weight:900;margin:0;"></h1>
      <div class="scenario-location" id="scenarioLocation"></div>
    </div>
    <div style="text-align:right;">
      <div class="points-label">PUNTOS</div>
      <div class="points-value" id="pointsDisplay">0</div>
    </div>
  </div>

  <!-- Barra de progreso -->
  <div class="progress-stages" id="stageProgress"></div>

  <!-- Área de escena -->
  <div id="sceneArea"></div>

  <!-- Panel de resultado -->
  <div id="resultPanel" style="display:none;margin-top:1.5rem;"></div>

  <!-- Botón siguiente -->
  <div id="nextBtn" style="display:none;margin-top:1.5rem;">
    <button class="next-stage-btn" onclick="advanceStage()">Continuar →</button>
  </div>

</div>

<style>

}

}

.points-label {

}

.points-value {

}

.progress-stages {

<script>
let callInterval = null;
let callSeconds = 0;

function updateScenarioHeader() {
  document.getElementById('scenarioTitle').textContent = SCENARIO.thumbnail + ' ' + SCENARIO.title;
  document.getElementById('scenarioLocation').textContent = '📍 ' + SCENARIO.location;
}

function updateProgressStages(currentIdx) {
  const container = document.getElementById('stageProgress');
  container.innerHTML = '';
  SCENARIO.stages.forEach((_, idx) => {
    const div = document.createElement('div');
    div.className = 'progress-stage';
    if (idx < currentIdx) div.classList.add('completed');
    if (idx === currentIdx) div.classList.add('active');
    container.appendChild(div);
  });
}

function showLoader(message = 'Analizando tu decisión...') {
  const resultPanel = document.getElementById('resultPanel');
  resultPanel.style.display = 'block';
  resultPanel.innerHTML = `
    <div class="loader-container">
      <div class="loader-text">${message}</div>
      <div class="loader-dots">
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
        <div class="loader-dot"></div>
      </div>
    </div>`;
  resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderStage(stage, idx) {
  const area = document.getElementById('sceneArea');
  area.innerHTML = '';
  document.getElementById('resultPanel').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  
  updateProgressStages(idx);
  
  let html = '';
  
  // Phone call stage
  if (stage.type === 'phone_call') {
    html = `
      <div class="phone-card">
        <div class="phone-header">
          <div class="phone-avatar">${stage.avatar || '📞'}</div>
          <div class="phone-info">
            <div class="phone-caller">${stage.caller}</div>
            <div class="phone-status">
              <span class="phone-status-dot"></span>
              Llamada en curso...
            </div>
          </div>
          <div class="phone-timer" id="callTimer">00:00</div>
        </div>
        <div class="phone-transcript" id="transcriptArea">
          <div id="transcriptLines"></div>
        </div>
      </div>`;
    area.innerHTML = html;
    startCallTimer();
    typeTranscript(stage.transcript, () => renderChoices(stage, idx));
    return;
  }
  
  // Email stage
  if (stage.type === 'email') {
    html = `
      <div class="email-card">
        <div class="email-toolbar">
          <div class="email-dot email-dot-red"></div>
          <div class="email-dot email-dot-yellow"></div>
          <div class="email-dot email-dot-green"></div>
          <span class="email-label">Bandeja de entrada</span>
        </div>
        <div class="email-body">
          <div class="email-field">
            <span class="email-field-key">De:</span>
            <span class="email-field-value email-sender-suspicious">${stage.sender}</span>
            <span class="email-suspicious-tag">⚠ Sospechoso</span>
          </div>
          <div class="email-field">
            <span class="email-field-key">Asunto:</span>
            <span class="email-field-value email-subject">${stage.subject}</span>
          </div>
          <hr style="border:none;border-top:1px solid var(--border-light);margin:1rem 0;">
          <div class="email-content">${stage.body}</div>
          ${stage.link_text ? `
          <div class="email-link-box">
            <div class="email-link-label">Enlace visible:</div>
            <div class="email-link-text">${stage.link_text}</div>
            <div class="email-link-label" style="margin-top:8px;">URL real:</div>
            <div class="email-link-real">${stage.link_real}</div>
          </div>` : ''}
        </div>
      </div>`;
    area.innerHTML = html;
    setTimeout(() => renderChoices(stage, idx), 300);
    return;
  }
  
  // Scene / conversation stage
  if (stage.type === 'scene' || stage.type === 'conversation' || stage.type === 'chat_message') {
    const icon = stage.type === 'chat_message' ? '💬' : stage.type === 'conversation' ? '🗣️' : '📍';
    html = `
      <div class="scene-card">
        <div class="scene-header">
          <span class="scene-icon">${icon}</span>
          <span class="scene-speaker">${stage.speaker || stage.sender || 'Situación'}</span>
        </div>
        ${stage.scene_text ? `<div class="scene-text">${stage.scene_text}</div>` : ''}
        <div id="transcriptLines"></div>
      </div>`;
    area.innerHTML = html;
    if (stage.transcript && stage.transcript.length > 0) {
      typeTranscript(stage.transcript, () => renderChoices(stage, idx));
    } else {
      renderChoices(stage, idx);
    }
    return;
  }
  
  // WiFi scan stage
  if (stage.type === 'wifi_scan') {
    let networksHtml = '';
    stage.available_networks.forEach(net => {
      const bars = '▂▄▆█'.slice(0, net.signal);
      const safeClass = net.safe ? 'wifi-item-safe' : 'wifi-item-danger';
      const lockIcon = net.lock ? '🔒' : '🔓';
      const signalColor = net.safe ? 'var(--accent-green)' : 'var(--accent-red)';
      networksHtml += `
        <div class="wifi-item ${safeClass}">
          <span class="wifi-lock" style="color:${signalColor}">${lockIcon}</span>
          <div class="wifi-info">
            <div class="wifi-ssid">${net.ssid}</div>
            <div class="wifi-note">${net.note}</div>
          </div>
          <div class="wifi-signal" style="color:${signalColor}">${bars}</div>
        </div>`;
    });
    html = `
      <div class="wifi-card">
        <div class="wifi-header">
          <span class="wifi-header-icon">📶</span>
          <span class="wifi-header-title">Redes WiFi disponibles</span>
        </div>
        <div class="wifi-list">${networksHtml}</div>
      </div>`;
    area.innerHTML = html;
    setTimeout(() => renderChoices(stage, idx), 400);
    return;
  }
  
  // Terminal stage
  if (stage.type === 'terminal') {
    html = `
      <div class="terminal-card">
        <div class="terminal-header">
          <div class="terminal-dot terminal-dot-red"></div>
          <div class="terminal-dot terminal-dot-yellow"></div>
          <div class="terminal-dot terminal-dot-green"></div>
          <span class="terminal-title">terminal — sistema de monitoreo</span>
        </div>
        <div class="terminal-body" id="terminalLines">
          <div class="terminal-prompt">root@cybertutor:~$</div>
        </div>
      </div>
      ${stage.scene_text ? `<div class="scene-text" style="margin-top:1rem;">${stage.scene_text}</div>` : ''}`;
    area.innerHTML = html;
    typeTerminal(stage.terminal_output, () => renderChoices(stage, idx));
    return;
  }
  
  // Attack visualization stage
  if (stage.type === 'attack_visualization') {
    let dataHtml = '';
    stage.captured_data.forEach(d => {
      dataHtml += `
        <div class="attack-data-item">
          <span class="attack-data-type">${d.type}</span>
          <div class="attack-data-content">
            <div class="attack-data-value">${d.data}</div>
            <div class="attack-data-site">${d.site}</div>
          </div>
        </div>`;
    });
    html = `
      <div class="attack-card">
        <div class="attack-header">
          <span class="attack-dot"></span>
          <span class="attack-title">ATAQUE EN TIEMPO REAL</span>
        </div>
        <div class="attack-body">
          <div class="attack-text">${stage.scene_text}</div>
          <div class="attack-data-box">
            <div class="attack-data-label">// DATOS INTERCEPTADOS POR EL ATACANTE:</div>
            ${dataHtml}
          </div>
        </div>
      </div>`;
    area.innerHTML = html;
    setTimeout(() => renderChoices(stage, idx), 600);
    return;
  }
  
  // Fallback
  area.innerHTML = `<p style="color:var(--text-muted);">Escena no reconocida: ${stage.type}</p>`;
  renderChoices(stage, idx);
}

function renderChoices(stage, stageIdx) {
  const choices = stage.choices || [];
  const question = stage.question || '¿Qué harías?';
  
  let optionsHtml = '';
  choices.forEach(c => {
    const riskColor = c.risk === 'bajo' ? 'var(--accent-green)' : c.risk === 'medio' ? 'var(--accent-orange)' : 'var(--accent-red)';
    optionsHtml += `
      <button class="option-btn" onclick="makeChoice('${stage.id}', '${c.id}', ${stageIdx})" id="choice-${c.id}">
        <i class="ti ${c.icon}" style="font-size:18px;color:${riskColor};flex-shrink:0;margin-top:1px;"></i>
        <span class="option-label">${c.label}</span>
      </button>`;
  });
  
  const html = `
    <div class="question-box">
      <div class="question-text">${question}</div>
      <div class="options-grid" id="optionsGrid">
        ${optionsHtml}
      </div>
    </div>`;
  
  const existing = document.getElementById('choicesArea');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.id = 'choicesArea';
  div.innerHTML = html;
  document.getElementById('sceneArea').appendChild(div);
}

async function makeChoice(stageId, choiceId, stageIdx) {
  if (awaitingNext) return;
  awaitingNext = true;
  
  // Disable all choice buttons
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  });
  
  showLoader();
  
  try {
    const res = await fetch('/sim/decision', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scenario_id: SCENARIO.id, stage_id: stageId, choice_id: choiceId })
    });
    const data = await res.json();
    
    totalPoints = data.total_points;
    document.getElementById('pointsDisplay').textContent = totalPoints;
    
    const isCorrect = data.is_correct;
    const headerClass = isCorrect ? 'result-header-correct' : 'result-header-incorrect';
    const verdictClass = isCorrect ? 'result-verdict-correct' : 'result-verdict-incorrect';
    const icon = isCorrect ? '✓' : '✗';
    const verdict = isCorrect ? 'Decisión correcta' : 'Decisión incorrecta';
    
    const resultPanel = document.getElementById('resultPanel');
    resultPanel.style.display = 'block';
    resultPanel.innerHTML = `
      <div class="result-card">
        <div class="result-header ${headerClass}">
          <span class="result-verdict-icon">${icon}</span>
          <div>
            <div class="result-verdict-text ${verdictClass}">${verdict}</div>
            <div class="result-points">${data.points} puntos</div>
          </div>
        </div>
        <div class="result-body">
          <div class="result-consequence">${data.consequence}</div>
          <div class="result-analysis">
            <div class="result-analysis-label">ANÁLISIS DE LA IA</div>
            <p class="result-analysis-text">${data.explanation}</p>
          </div>
          <div class="result-lesson">
            <span class="result-lesson-label">Lección clave: </span>
            <span class="result-lesson-text">${data.lesson}</span>
          </div>
        </div>
      </div>`;
    
    const nextBtn = document.getElementById('nextBtn');
    nextBtn.style.display = 'block';
    if (data.has_next) {
      nextBtn.querySelector('button').textContent = 'Continuar →';
      nextBtn.querySelector('button').onclick = () => {
        currentStageIndex = data.next_index;
        awaitingNext = false;
        renderStage(SCENARIO.stages[currentStageIndex], currentStageIndex);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    } else {
      nextBtn.querySelector('button').textContent = 'Ver resultados finales →';
      nextBtn.querySelector('button').style.background = 'linear-gradient(135deg, var(--accent-green), var(--accent-green-dark))';
      nextBtn.querySelector('button').onclick = () => {
        window.location.href = `/sim/${SCENARIO.id}/results`;
      };
    }
    
    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
  } catch(e) {
    const resultPanel = document.getElementById('resultPanel');
    resultPanel.innerHTML = `<div style="padding:1rem;color:var(--accent-red);">Error: ${e.message}</div>`;
    awaitingNext = false;
  }
}

// Transcript typing animation
function typeTranscript(lines, callback) {
  const container = document.getElementById('transcriptLines');
  if (!container || !lines || lines.length === 0) {
    if (callback) callback();
    return;
  }
  let i = 0;
  function addLine() {
    if (i >= lines.length) {
      if (callback) callback();
      return;
    }
    const line = lines[i];
    const isUser = line.role === 'user';
    const div = document.createElement('div');
    div.style.cssText = `display:flex;gap:10px;margin-bottom:10px;${isUser ? 'justify-content:flex-end;' : ''}`;
    div.innerHTML = `<div style="max-width:85%;padding:10px 14px;border-radius:12px;${isUser ? 'background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.2);border-bottom-right-radius:4px;' : 'background:var(--bg-tertiary);border:1px solid var(--border-light);border-bottom-left-radius:4px;'};font-size:13px;color:var(--text-primary);line-height:1.6;">${line.text}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    i++;
    setTimeout(addLine, 800 + Math.random() * 400);
  }
  setTimeout(addLine, 300);
}

// Terminal typing animation
function typeTerminal(lines, callback) {
  const container = document.getElementById('terminalLines');
  if (!container) {
    if (callback) callback();
    return;
  }
  let i = 0;
  function addLine() {
    if (i >= lines.length) {
      setTimeout(() => { if (callback) callback(); }, 500);
      return;
    }
    const line = lines[i];
    const isAlert = line.includes('ALERTA') || line.includes('ABIERTO');
    const div = document.createElement('div');
    div.className = `terminal-line ${isAlert ? 'terminal-line-error' : 'terminal-line-normal'}`;
    div.textContent = (i === 0 ? '' : '> ') + line;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
    i++;
    setTimeout(addLine, 300 + Math.random() * 200);
  }
  setTimeout(addLine, 200);
}

// Call timer
function startCallTimer() {
  if (callInterval) clearInterval(callInterval);
  callSeconds = 0;
  callInterval = setInterval(() => {
    callSeconds++;
    const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
    const s = String(callSeconds % 60).padStart(2, '0');
    const el = document.getElementById('callTimer');
    if (el) el.textContent = `${m}:${s}`;
  }, 1000);
}

// Initialize
window.addEventListener('DOMContentLoaded', () => {
  updateScenarioHeader();
  renderStage(SCENARIO.stages[0], 0);
});
</script>
