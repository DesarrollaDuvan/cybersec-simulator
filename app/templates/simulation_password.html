{% extends "base.html" %}
{% block content %}

<div class="pw-sim">
  <h2 class="sr-only">Simulación de consecuencias de contraseñas — toma decisiones y ve qué pasa</h2>

  <!-- Progress bar -->
  <div class="pw-progress-wrap">
    <div class="pw-dots" id="dots"></div>
    <span class="pw-score-label" id="score-label">0 pts</span>
  </div>

  <!-- FASE 1: Escenario + Decisión -->
  <div class="pw-phase active" id="p1">
    <div class="pw-scenario-header">
      <span class="pw-scenario-badge" id="sc-badge">Escenario 1 de 3</span>
    </div>
    <h3 class="pw-title" id="sc-title"></h3>
    <p class="pw-desc"  id="sc-desc"></p>

    <div class="pw-context-card">
      <div class="pw-context-label">Situación</div>
      <p class="pw-context-text" id="sc-context"></p>
    </div>

    <div class="pw-choices-label">Elige tu acción:</div>
    <div class="pw-choices" id="choices-container"></div>

    <button class="pw-submit-btn" id="submit-btn" disabled onclick="submitChoice()">
      Ver consecuencias →
    </button>
  </div>

  <!-- FASE 2: Consecuencia animada -->
  <div class="pw-phase" id="p2">
    <div id="consequence-area"></div>
    <button class="pw-submit-btn" id="next-btn" style="display:none" onclick="showLesson()">
      Ver lección aprendida →
    </button>
  </div>

  <!-- FASE 3: Lección -->
  <div class="pw-phase" id="p3">
    <div class="pw-lesson-section">
      <h3 class="pw-lesson-title" id="lesson-title"></h3>
      <div class="pw-lesson-points" id="lesson-points"></div>
    </div>
    <div class="pw-scenario-nav" id="scenario-nav"></div>
  </div>
</div>

<style>
/* ── Reset básico ──────────────────────────────────────────── */
.pw-sim * { box-sizing: border-box; }

.pw-sim {
  max-width: 680px;
  margin: 0 auto;
  padding: 1.5rem 0 3rem;
  position: relative;
  z-index: 1;
}

/* ── Progress ──────────────────────────────────────────────── */
.pw-progress-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.5rem;
}
.pw-dots { display: flex; gap: 6px; }
.pw-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border-light);
  transition: background 0.3s;
}
.pw-dot.done    { background: var(--text-primary); }
.pw-dot.current { background: var(--accent-green); }
.pw-score-label {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

/* ── Fases ─────────────────────────────────────────────────── */
.pw-phase { display: none; }
.pw-phase.active { display: block; }

/* ── Fase 1: escenario ─────────────────────────────────────── */
.pw-scenario-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  padding: 3px 12px;
  border-radius: 20px;
  background: var(--accent-green-bg);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  margin-bottom: 1rem;
}

.pw-title {
  font-size: 1.5rem;
  font-weight: 900;
  color: var(--text-primary);
  margin-bottom: 6px;
}

.pw-desc {
  color: var(--text-secondary);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 1.25rem;
}

.pw-context-card {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 1.25rem 1.5rem;
  margin-bottom: 1.5rem;
}
.pw-context-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.pw-context-text {
  font-size: 15px;
  color: var(--text-primary);
  line-height: 1.75;
}

/* ── Choices ───────────────────────────────────────────────── */
.pw-choices-label {
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.pw-choices {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 1.5rem;
}
.pw-choice-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  cursor: pointer;
  text-align: left;
  transition: border-color var(--transition-fast), background var(--transition-fast);
  font-family: var(--font-sans);
  width: 100%;
}
.pw-choice-btn:hover {
  background: var(--bg-elevated);
  border-color: var(--border-medium);
}
.pw-choice-btn.selected {
  border-color: var(--accent-blue);
  background: var(--accent-blue-bg);
}
.pw-choice-letter {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  background: var(--bg-elevated);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
}
.pw-choice-btn.selected .pw-choice-letter {
  background: var(--accent-blue-bg);
  color: var(--accent-blue);
  border-color: var(--accent-blue);
}
.pw-choice-main { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.pw-choice-sub  { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* ── Submit button ─────────────────────────────────────────── */
.pw-submit-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, var(--accent-green), var(--accent-green-dark));
  border: none;
  border-radius: var(--radius-md);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  transition: opacity var(--transition-fast), transform var(--transition-fast);
  letter-spacing: 0.3px;
}
.pw-submit-btn:hover:not(:disabled) { opacity: 0.9; transform: scale(1.01); }
.pw-submit-btn:disabled { opacity: 0.35; cursor: default; }

/* ── Fase 2: terminal de ataque ────────────────────────────── */
.pw-attack-terminal {
  background: var(--bg-primary);
  border: 1px solid var(--border-medium);
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 1.25rem;
}
.pw-terminal-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  background: var(--bg-tertiary);
  border-bottom: 1px solid var(--border-light);
}
.pw-t-dot { width: 10px; height: 10px; border-radius: 50%; }
.pw-t-dot-r { background: var(--accent-red); }
.pw-t-dot-y { background: var(--accent-orange); }
.pw-t-dot-g { background: var(--accent-green); }
.pw-t-title {
  margin-left: 6px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.5px;
}
.pw-terminal-body {
  padding: 1rem 1.25rem;
  min-height: 160px;
  font-family: var(--font-mono);
}
.pw-t-line {
  font-size: 13px;
  line-height: 1.8;
  color: var(--accent-blue);
  display: block;
  opacity: 0;
  transition: opacity 0.3s;
}
.pw-t-line.show   { opacity: 1; }
.pw-t-line.warn   { color: var(--accent-orange); }
.pw-t-line.error  { color: var(--accent-red); }
.pw-t-line.ok     { color: var(--accent-green); }
.pw-t-line.dim    { color: var(--text-muted); }

.pw-t-cursor {
  display: inline-block;
  width: 8px; height: 13px;
  background: var(--accent-blue);
  vertical-align: -2px;
  animation: pw-blink 0.8s step-end infinite;
}
@keyframes pw-blink { 50% { opacity: 0; } }

/* ── Breach cards ──────────────────────────────────────────── */
.pw-breach-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 1.25rem;
}
@media (max-width: 500px) { .pw-breach-cards { grid-template-columns: 1fr; } }

.pw-breach-card {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 1rem 1.25rem;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s, transform 0.4s;
}
.pw-breach-card.show { opacity: 1; transform: none; }
.pw-breach-card.danger  { border-color: var(--accent-red); }
.pw-breach-card.warning { border-color: var(--accent-orange); }

.pw-bc-icon  { font-size: 22px; margin-bottom: 8px; }
.pw-bc-label {

.pw-bc-value.danger  { color: var(--accent-red); }
.pw-bc-value.warning { color: var(--accent-orange); }
.pw-bc-value.ok      { color: var(--accent-green); }

/* ── Hero outcome (decisión correcta) ─────────────────────── */
.pw-hero-outcome {

.pw-hero-check { font-size: 40px; margin-bottom: 14px; }
.pw-hero-title {
  font-size: 1.2rem;
  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.pw-hero-desc {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.65;
  margin-bottom: 1.25rem;
}
.pw-hero-stats {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;

.pw-h-stat {
  background: var(--bg-elevated);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 10px 16px;
  text-align: center;

.pw-h-stat-num {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-green);
  display: block;

.pw-h-stat-lbl {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;

.pw-lesson-title {

  font-weight: 800;
  color: var(--text-primary);
  margin-bottom: 12px;

  align-items: flex-start;

  border-radius: var(--radius-md);
  padding: 12px 14px;
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.55;

.pw-lp-icon { color: var(--accent-blue); flex-shrink: 0; margin-top: 1px; font-size: 15px; }

/* ── Navegación final ──────────────────────────────────────── */
.pw-scenario-nav { display: flex; gap: 10px; }
.pw-nav-btn {
  flex: 1;
  padding: 12px;
  background: var(--bg-tertiary);

.pw-nav-btn.primary {

  color: #fff;

.pw-nav-btn.primary:hover { opacity: 0.9; }

/* ── Pantalla de resultado final ───────────────────────────── */
.pw-final {
  text-align: center;
  padding: 1.5rem 0;
}
.pw-final-icon  { font-size: 48px; margin-bottom: 16px; }
.pw-final-title { font-size: 1.4rem; font-weight: 900; color: var(--text-primary); margin-bottom: 8px; }
.pw-final-desc  {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.65;
  max-width: 440px;
  margin: 0 auto 1.5rem;
}
</style>

/* ── helpers ── */
function pwShowPhase(id) {
  document.querySelectorAll(".pw-phase").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if (id === "p2") document.getElementById("next-btn").style.display = "none";
}

function pwUpdateDots() {
  const dots = document.getElementById("dots");
  dots.innerHTML = PW_SCENARIOS.map((_, i) => {
    const cls = i < pwCurrentIdx ? "done" : i === pwCurrentIdx ? "current" : "";
    return `<div class="pw-dot ${cls}"></div>`;
  }).join("");
  document.getElementById("score-label").textContent = `${Math.round(pwScore)} pts`;
}

/* ── init escenario ── */
function pwInit(idx) {
  const sc = PW_SCENARIOS[idx];
  pwSelectedId = null;

  document.getElementById("sc-badge").textContent    = `Escenario ${idx+1} de ${PW_SCENARIOS.length}`;
  document.getElementById("sc-title").textContent    = sc.title;
  document.getElementById("sc-desc").textContent     = sc.desc;
  document.getElementById("sc-context").textContent  = sc.context;

  const container = document.getElementById("choices-container");
  container.innerHTML = "";
  sc.choices.forEach(ch => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pw-choice-btn";
    btn.dataset.id = ch.id;
    btn.innerHTML = `
      <div class="pw-choice-letter">${ch.id.toUpperCase()}</div>
      <div>
        <div class="pw-choice-main">${ch.main}</div>
        <div class="pw-choice-sub">${ch.sub}</div>
      </div>`;
    btn.onclick = () => pwSelectChoice(ch.id);
    container.appendChild(btn);
  });

  pwUpdateDots();
  document.getElementById("submit-btn").disabled = true;
  pwShowPhase("p1");
}

function pwSelectChoice(id) {
  pwSelectedId = id;
  document.querySelectorAll(".pw-choice-btn").forEach(b => b.classList.remove("selected"));
  document.querySelector(`.pw-choice-btn[data-id="${id}"]`).classList.add("selected");
  document.getElementById("submit-btn").disabled = false;
}

/* ── submit → consecuencia ── */
function submitChoice() {
  const sc = PW_SCENARIOS[pwCurrentIdx];
  const isCorrect = pwSelectedId === sc.correctId;
  pwResults.push({ scId: pwCurrentIdx, correct: isCorrect });
  if (isCorrect) pwScore += 33;
  pwShowPhase("p2");
  pwAnimateConsequence(sc, isCorrect);
}

function pwAnimateConsequence(sc, isCorrect) {
  const area = document.getElementById("consequence-area");

  if (isCorrect) {
    area.innerHTML = `
      <div class="pw-hero-outcome" id="pw-hero-box">
        <div class="pw-hero-check">✓</div>
        <div class="pw-hero-title">${sc.goodOutcome.title}</div>
        <p class="pw-hero-desc">${sc.goodOutcome.desc}</p>
        <div class="pw-hero-stats">
          ${sc.goodOutcome.stats.map(s => `
            <div class="pw-h-stat">
              <span class="pw-h-stat-num">${s.num}</span>
              <span class="pw-h-stat-lbl">${s.lbl}</span>
            </div>`).join("")}
        </div>
      </div>`;
    setTimeout(() => document.getElementById("pw-hero-box").classList.add("show"), 100);
    setTimeout(() => { document.getElementById("next-btn").style.display = "block"; }, 1200);
  } else {
    const atk = sc.badAttack;
    const linesHtml = atk.lines.map((l, i) =>
      `<span class="pw-t-line ${l.cls}" id="pwt${i}">${l.text}</span>`).join("\n");
    const cardsHtml = atk.cards.map((c, i) => `
      <div class="pw-breach-card ${c.cls}" id="pwbc${i}">
        <div class="pw-bc-icon">${c.icon}</div>
        <div class="pw-bc-label">${c.label}</div>
        <div class="pw-bc-value ${c.cls}">${c.value}</div>
      </div>`).join("");

    area.innerHTML = `
      <div style="font-family:var(--sans);font-size:13px;font-weight:700;color:#f87171;margin-bottom:12px;">
        ✕ Decisión incorrecta — esto ocurrió después:
      </div>
      <div class="pw-attack-terminal">
        <div class="pw-terminal-bar">
          <div class="pw-t-dot pw-t-dot-r"></div>
          <div class="pw-t-dot pw-t-dot-y"></div>
          <div class="pw-t-dot pw-t-dot-g"></div>
          <span class="pw-t-title">${atk.title}</span>
        </div>
        <div class="pw-terminal-body">
          ${linesHtml}
          <span class="pw-t-cursor" id="pw-cursor"></span>
        </div>
      </div>
      <div class="pw-breach-cards">${cardsHtml}</div>`;

    atk.lines.forEach((l, i) => {
      setTimeout(() => {
        const el = document.getElementById(`pwt${i}`);
        if (el) el.classList.add("show");
      }, l.t);
    });

    const lastT = atk.lines[atk.lines.length - 1].t + 800;
    atk.cards.forEach((c, i) => {
      setTimeout(() => {
        const el = document.getElementById(`pwbc${i}`);
        if (el) el.classList.add("show");
      }, lastT + i * 160);
    });

    setTimeout(() => {
      const cur = document.getElementById("pw-cursor");
      if (cur) cur.style.display = "none";
      document.getElementById("next-btn").style.display = "block";
    }, lastT + atk.cards.length * 160 + 400);
  }
}

/* ── lección ── */
function showLesson() {
  const sc = PW_SCENARIOS[pwCurrentIdx];
  const isCorrect = pwResults[pwCurrentIdx]?.correct;

  document.getElementById("lesson-title").textContent = isCorrect
    ? "Por qué fue la decisión correcta"
    : "Lo que debes recordar de este escenario";

  document.getElementById("lesson-points").innerHTML = sc.lessons.map(l => `
    <div class="pw-lesson-point">
      <span class="pw-lp-icon">ℹ</span>
      <span>${l}</span>
    </div>`).join("");

  const nav = document.getElementById("scenario-nav");
  const isLast = pwCurrentIdx >= PW_SCENARIOS.length - 1;
  nav.innerHTML = isLast
    ? `<button class="pw-nav-btn primary" onclick="pwShowFinal()">Ver resultado final →</button>`
    : `<button class="pw-nav-btn primary" onclick="pwNext()">Siguiente escenario →</button>`;

  pwShowPhase("p3");
}

function pwNext() {
  pwCurrentIdx++;
  pwInit(pwCurrentIdx);
}

/* ── pantalla final ── */
function pwShowFinal() {
  const correct = pwResults.filter(r => r.correct).length;
  const total   = PW_SCENARIOS.length;
  const pct     = Math.round((correct / total) * 100);
  const icon    = pct >= 67 ? "🛡️" : pct >= 33 ? "⚠️" : "🚨";
  const tit     = pct >= 67 ? "Buenas decisiones de seguridad" : pct >= 33 ? "Hay margen de mejora" : "Zona de riesgo crítico";
  const desc    = pct >= 67
    ? "Tienes buenas bases. Mantén estas prácticas y añade 2FA a todas tus cuentas críticas."
    : "Revisa los escenarios y considera implementar un gestor de contraseñas esta semana.";

  document.getElementById("p3").innerHTML = `
    <div class="pw-final">
      <div class="pw-final-icon">${icon}</div>
      <h3 class="pw-final-title">${tit}</h3>
      <p class="pw-final-desc">${desc}</p>
      <div class="pw-hero-stats" style="justify-content:center;margin-bottom:1.5rem">
        <div class="pw-h-stat"><span class="pw-h-stat-num">${correct}/${total}</span><span class="pw-h-stat-lbl">Correctas</span></div>
        <div class="pw-h-stat"><span class="pw-h-stat-num">${pct}%</span><span class="pw-h-stat-lbl">Puntuación</span></div>
        <div class="pw-h-stat"><span class="pw-h-stat-num">${Math.round(pwScore)}</span><span class="pw-h-stat-lbl">Puntos</span></div>
      </div>
      <button class="pw-nav-btn primary" style="max-width:260px;margin:0 auto;display:block" onclick="pwRestart()">
        Reiniciar simulación
      </button>
    </div>`;
}

function pwRestart() {
  pwCurrentIdx = 0; pwScore = 0; pwResults = [];
  pwInit(0);
}

/* ── arranque ── */
pwInit(0);
</script>

{% endblock %}
